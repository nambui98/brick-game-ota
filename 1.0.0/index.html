<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="brick-config" content="./config.json">
<title>Brick Game 9999 in 1 — preview</title>
<style>
  :root {
    /* Shell colours are overwritten from core/ShellConfig.ts (resolveShell) at runtime. */
    --backdrop: #3a2e0e;
    --body: #f2c230;
    --body-edge: #b8891a;
    --body-highlight: #ffe07a;
    --print: #3a2e0e;
    --button: #2f9e8f;
    --button-edge: #1b6b60;
    --button-highlight: #7fd8c9;
    --small: #222;
    --bezel: #2b2b2b;
    --glass: #9ead86;
    --glass-edge: #7f8d6a;
    --ink: #1b1f1a;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; background: var(--backdrop); font-family: "Helvetica Neue", Arial, sans-serif;
    /* No pinch-zoom, double-tap zoom, text selection or pull-to-refresh while playing. */
    touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
    overscroll-behavior: none;
  }
  body {
    display: flex; align-items: center; justify-content: center; overflow: hidden;
    /* dvh follows the mobile browser chrome. Only the side insets pad the page: the case
       itself runs under the notch and home bar, and its first/last rows keep the content clear. */
    min-height: 100dvh;
    padding: 0 env(safe-area-inset-right, 0) 0 env(safe-area-inset-left, 0);
  }
  /* The stage owns the 9:16 width formula and is the container that cqw units resolve
     against; container units used on an element resolve against its ancestor container,
     so they cannot be used on .console for its own rows. */
  .stage {
    width: min(100vw, 56.25vh); /* fallback for browsers without dvh */
    width: min(100vw - env(safe-area-inset-left, 0px) - env(safe-area-inset-right, 0px), 100dvh * 9 / 16);
    container-type: inline-size;
  }
  .console {
    position: relative; width: 100%;
    /* The classic shell is 9:16 (177.8cqw tall). Taller phones stretch the case up to 9:21.5
       instead of floating it in a dark band; the extra height goes to the header band and,
       twice as much, to the grip below the buttons, like the long lower case of the E-9999. */
    height: clamp(177.8cqw, 100vh, 225cqw);
    height: clamp(177.8cqw, 100dvh, 225cqw);
    display: grid; grid-template-rows: 8.5% 45% 3% 9% 26.5% 8%; padding: 0 4.5%;
    /* Rows in shell-width units: percentage rows + aspect-ratio children resolve
       differently on iOS Safari. */
    grid-template-rows: minmax(calc(11cqw + env(safe-area-inset-top, 0px)), 1fr) 86cqw 5cqw 15cqw 39cqw minmax(calc(21.8cqw + env(safe-area-inset-bottom, 0px)), 3fr);
    /* Type scales with the shell itself (cqw), never below a readable floor on small phones. */
    container-type: inline-size;
  }
  .body {
    position: absolute; inset: 1.5% 2%; border-radius: 9% / 5%;
    background: var(--body); border: 4px solid var(--body-edge);
    box-shadow: inset 0 0 0 3px var(--body-highlight), 0 20px 60px rgba(0,0,0,.5);
  }
  /* Taller than 9:17.5 the console is stretched to the viewport: the case meets the top and
     bottom screen edges (its corners round off just like the phone's), no dark band. */
  @media (max-aspect-ratio: 9 / 17.5) { .body { inset: 0 2%; } }
  .brand { position: relative; z-index: 1; text-align: center; color: var(--print); font-weight: 800; letter-spacing: .08em; text-shadow: 0 1px 0 rgba(255, 240, 180, .35); }
  .brand { letter-spacing: .22em; padding-top: calc(2.5% + env(safe-area-inset-top, 0px)); }
  /* Printed decoration: a thin frame around the screen with brick columns inside it. */
  .screen-row {
    position: relative; z-index: 1; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
    border: 3px solid var(--print); border-radius: 10px; margin: 0 0.5%; padding: 1.5% 1%;
  }
  .bricks { display: flex; flex-direction: column; align-items: center; justify-content: space-evenly; height: 82%; height: 72cqw; }
  /* One brick cell ≈ 3.2% of the shell width; a 4-wide I piece spans the whole side column. */
  .bricks canvas { display: block; image-rendering: pixelated; height: auto; width: calc(var(--cells) * 2.6cqw); max-width: 100%; }
  /* Moulded ribbed grip band under the screen — added/removed by shell-shape.ts. */
  .ribs { position: relative; z-index: 1; display: flex; align-items: center; }
  .rib-band { width: 100%; height: 60%; margin: 0 6%; border-radius: 3px; background: repeating-linear-gradient(90deg, var(--body-edge) 0 3px, var(--body-highlight) 3px 4px, transparent 4px 7px); opacity: .75; }
  .foot { position: relative; z-index: 1; display: flex; justify-content: space-between; align-items: flex-end; padding: 0 7% calc(7cqw + env(safe-area-inset-bottom, 0px)); min-height: 0; }
  .foot > * { max-height: 100%; }
  /* Speaker grille, as on the real case: fills the long base of a stretched shell and
     has zero height (hidden) when the foot is at its 9:16 minimum. */
  .foot::before {
    content: ""; position: absolute; left: 22%; right: 22%; top: 4cqw; bottom: calc(24cqw + env(safe-area-inset-bottom, 0px));
    border-radius: 3cqw; pointer-events: none; opacity: .55;
    background: radial-gradient(circle, var(--body-edge) 0 0.55cqw, transparent 0.75cqw) 0 0 / 2.4cqw 2.4cqw;
    -webkit-mask: linear-gradient(#000, #000);
  }
  .foot-brand { transform: rotate(-6deg); transform-origin: left bottom; color: var(--print); text-shadow: 0 1px 0 rgba(255, 240, 180, .35); line-height: 1.1; }
  .foot-brand b { display: block; font-size: clamp(13px, 3vmin, 26px); font-size: clamp(13px, 5.6cqw, 26px); font-weight: 900; letter-spacing: .06em; font-style: italic; border-bottom: 3px solid var(--print); padding-bottom: 2px; }
  .foot-brand small { display: block; font-size: clamp(8px, 1.6vmin, 13px); font-size: clamp(8px, 2.6cqw, 13px); font-weight: 700; letter-spacing: .12em; margin-top: 2px; }
  .mascot-wrap { display: flex; flex-direction: column; align-items: center; gap: .2em; }
  .mascot { width: clamp(32px, 10cqw, 60px); height: auto; image-rendering: pixelated; display: block; }
  .mascot-name { font-size: clamp(8px, 1.6vmin, 12px); font-size: clamp(8px, 2.2cqw, 12px); font-weight: 700; color: var(--print); letter-spacing: .06em; text-transform: uppercase; }
  /* Stickers layer: covers the whole shell so x/y/scale map 1:1 with the Cocos view. */
  /* During play stickers sit on the plastic under the screen and buttons and never take touches;
     in arrange mode the layer rises above everything and becomes draggable. */
  .stickers-layer { position: absolute; inset: 0; z-index: 0; pointer-events: none; }
  .stickers-layer.arranging { z-index: 3; pointer-events: auto; }
  .stickers-layer .sticker { pointer-events: none; }
  .stickers-layer.arranging .sticker { pointer-events: auto; }
  .stickers-layer .sticker img { -webkit-user-drag: none; user-select: none; -webkit-user-select: none; }
  .stickers-layer .sticker.selected { outline: 2px dashed #fff; outline-offset: 4px; }
  /* Controls printed on the selected sticker: ✕ delete (top-left), ✓ done (top-right),
     ⟳ corner handle (bottom-right) — drag it to resize and rotate in one motion. */
  .sticker-badge {
    position: absolute; width: 34px; height: 34px; border-radius: 50%; padding: 0;
    border: 2px solid #2a2210; background: #f6f0dc; color: #2a2210; font-size: 16px; font-weight: 800; line-height: 1;
    cursor: pointer; display: flex; align-items: center; justify-content: center; touch-action: none; user-select: none;
    box-shadow: 0 1px 3px rgba(0,0,0,.35);
  }
  .sticker-remove { top: -17px; left: -17px; }
  .sticker-ok { top: -17px; right: -17px; background: #2a2210; color: #f6f0dc; }
  .sticker-handle { bottom: -17px; right: -17px; cursor: grab; background: #ffd23f; font-size: 18px; }
  /* Settings card */
  /* Settings: a bottom sheet on phones, a centred card on wide screens. Header and tab bar stay
     put; only the panel scrolls. Rows are "label left, controls right" to keep it short. */
  .settings { position: fixed; inset: 0; z-index: 10; display: flex; align-items: flex-end; justify-content: center; background: rgba(0,0,0,0); transition: background-color 220ms ease; }
  .settings.open { background: rgba(0,0,0,.6); }
  .settings[hidden] { display: none; }
  .settings .card { transform: translateY(100%); transition: transform 260ms cubic-bezier(.2, .8, .2, 1); will-change: transform; }
  .settings.open .card { transform: none; }
  @media (prefers-reduced-motion: reduce) { .settings, .settings .card { transition: none; } }
  .card {
    width: min(100vw, 480px); max-height: 92vh; max-height: calc(100dvh - env(safe-area-inset-top, 0px) - 12px);
    display: flex; flex-direction: column; overflow: hidden;
    background: #f6f0dc; color: #2a2210; border: 3px solid #2a2210; border-bottom: 0; border-radius: 20px 20px 0 0;
    padding: 0 0 env(safe-area-inset-bottom, 0px); font-weight: 700; letter-spacing: .02em; text-align: left;
  }
  @media (min-width: 700px) and (min-height: 700px) {
    .settings { align-items: center; }
    .card { border-bottom: 3px solid #2a2210; border-radius: 20px; max-height: min(90vh, 760px); }
    .settings .card { transform: translateY(24px); opacity: 0; transition: transform 220ms ease, opacity 220ms ease; }
    .settings.open .card { transform: none; opacity: 1; }
  }
  .card-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px 8px 18px; }
  .card h2 { margin: 0; font-size: 17px; letter-spacing: .14em; }
  .close-x { width: 36px; height: 36px; flex: 0 0 36px; border-radius: 50%; border: 2px solid #2a2210; background: transparent; color: #2a2210; font: inherit; font-size: 16px; line-height: 1; padding: 0; cursor: pointer; display: grid; place-items: center; }
  .tabs { display: flex; gap: 4px; padding: 0 12px 10px; margin: 0; border-bottom: 2px solid #2a2210; }
  .tab-btn { flex: 1 1 0; min-width: 0; border: 2px solid #2a2210; background: #f6f0dc; color: #2a2210; border-radius: 999px; padding: 8px 2px; font: inherit; font-size: 10.5px; letter-spacing: .02em; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tab-btn[aria-pressed="true"] { background: #2a2210; color: #f6f0dc; }
  .card-body { overflow-y: auto; touch-action: pan-y; -webkit-overflow-scrolling: touch; padding: 4px 16px 18px; }
  .tab-panel[hidden] { display: none; }
  .card p { margin: 8px 0; font-size: 12px; opacity: .75; }
  .setting-row { display: grid; grid-template-columns: 92px minmax(0, 1fr); align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid rgba(42,34,16,.14); }
  .setting-row.stack { grid-template-columns: 1fr; }
  .setting-label { font-size: 11px; letter-spacing: .1em; opacity: .75; }
  .setting-hint { font-size: 12px; opacity: .7; margin-top: 4px; }
  .pills { display: flex; gap: 8px; flex-wrap: wrap; }
  .pill { border: 2px solid #2a2210; background: #f6f0dc; color: #2a2210; border-radius: 999px; padding: 8px 14px; font: inherit; font-size: 13px; cursor: pointer; min-width: 40px; min-height: 40px; }
  .pill[aria-pressed="true"] { background: #2a2210; color: #f6f0dc; }
  .swatches { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .swatch { width: 36px; height: 36px; border-radius: 50%; border: 3px solid var(--edge); background: var(--fill); cursor: pointer; padding: 0; box-shadow: 0 0 0 2px #f6f0dc; }
  .swatch[aria-pressed="true"] { box-shadow: 0 0 0 2px #f6f0dc, 0 0 0 5px #2a2210; }
  .swatch.custom { border-color: transparent; background: radial-gradient(circle, var(--fill) 58%, transparent 60%), conic-gradient(#f43, #fc3, #6d3, #3dc, #36f, #c3f, #f43); }
  #custom-color, #glass-color { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
  .color-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  #shell-name { font-size: 12px; opacity: .8; }
  .color-input { width: 40px; height: 40px; border: 2px solid #2a2210; border-radius: 10px; padding: 2px; background: #fff; cursor: pointer; }
  .field-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 6px 0; }
  .text-input { border: 2px solid #2a2210; border-radius: 10px; padding: 8px 12px; font: inherit; font-size: 16px; flex: 1 1 140px; min-width: 0; max-width: 260px; }
  #sticker-file { display: none; }
  #sticker-list { display: flex; flex-direction: column; gap: 8px; margin: 10px 0; max-height: 160px; overflow-y: auto; touch-action: pan-y; }
  .sticker-row { display: flex; align-items: center; gap: 8px; }
  .sticker-row .sticker-thumb { cursor: pointer; }
  .sticker-row .sticker-edit { margin-left: auto; }
  .sticker-thumb { width: 40px; height: 40px; object-fit: contain; border: 2px solid #2a2210; border-radius: 6px; background: #fff; }
  #sticker-message, #preset-message { min-height: 1.2em; font-size: 12px; color: #a13a1f; }
  #preset-list { display: flex; flex-direction: column; gap: 8px; margin: 10px 0; max-height: 140px; overflow-y: auto; touch-action: pan-y; }
  .preset-row { display: flex; align-items: center; gap: 8px; justify-content: space-between; }
  .preset-name { flex: 1; text-align: left; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #share-code { word-break: break-all; font-size: 12px; background: #fff; border: 2px solid #2a2210; border-radius: 10px; padding: 8px; margin: 8px 0; }
  .arrange-bar {
    position: fixed; left: 0; right: 0; top: 0; z-index: 11; display: flex; align-items: center; justify-content: space-between;
    gap: 10px; background: #2a2210; color: #f6f0dc; padding: 10px 14px; font-size: 12px; font-weight: 700;
    padding-top: max(10px, env(safe-area-inset-top, 0px));
  }
  .arrange-bar[hidden] { display: none; }
  .arrange-bar .readout { font-variant-numeric: tabular-nums; min-width: 78px; text-align: center; opacity: .9; white-space: nowrap; }
  /* Each size has a vmin fallback first for browsers without container units. */
  .brand { font-size: clamp(15px, 3.2vmin, 30px); font-size: clamp(15px, 6cqw, 30px); align-self: center; }
  .bezel {
    position: relative; z-index: 1; justify-self: center; width: min(100%, 300px); height: 100%; aspect-ratio: 480 / 600;
    /* Explicit size in shell-width units so the bezel can never outgrow its row. */
    width: 64.4cqw; height: 80.5cqw; aspect-ratio: auto;
    background: var(--bezel); border-radius: 3%; border: 3px solid #111; padding: 3.5%;
  }
  #lcd { display: block; width: 100%; height: 100%; background: var(--glass); border: 2px solid var(--glass-edge); border-radius: 4px; image-rendering: pixelated; }
  .small-row { position: relative; z-index: 1; display: flex; justify-content: space-around; align-items: flex-start; }
  .small-row .key { display: flex; flex-direction: column; align-items: center; gap: .4em; }
  .cap {
    position: relative; border-radius: 50%; touch-action: none; cursor: pointer; user-select: none;
    /* The moulded rim is a border of the cap itself (not a box-shadow): WebKit snaps a box-shadow
       ring and the background to device pixels separately, which showed as a shifted rim on iOS. */
    border: 3px solid rgba(0,0,0,.28); background-clip: padding-box; -webkit-appearance: none; appearance: none; padding: 0; margin: 0;
    transition: transform 40ms; box-shadow: inset 0 -4px 0 rgba(0,0,0,.35);
  }
  .cap:active, .cap.down { transform: scale(.94); box-shadow: inset 0 -2px 0 rgba(0,0,0,.35); }
  /* A thumb landing on the rim or just off the cap still counts: the hit area is wider than the moulding. */
  .cap::after { content: ""; position: absolute; inset: -18%; border-radius: 50%; }
  .small .cap { width: clamp(44px, 6vmin, 60px); height: clamp(44px, 6vmin, 60px); width: clamp(44px, 11cqw, 60px); height: clamp(44px, 11cqw, 60px); background: var(--small); }
  .small span { font-size: clamp(8px, 1.6vmin, 13px); font-size: clamp(8px, 2.4cqw, 13px); font-weight: 700; color: var(--print); letter-spacing: .03em; white-space: nowrap; }
  .pads { position: relative; z-index: 1; display: grid; grid-template-columns: 1fr 1fr; align-items: center; }
  /* isolation: the cross bars use z-index:-1 and must sit under the caps but above the shell, so
     the stacking context has to be the d-pad. The bars belong to the d-pad, not to the caps: a
     pressed cap (transform) forms its own stacking context and would paint a child bar over itself. */
  .dpad { position: relative; isolation: isolate; justify-self: center; width: clamp(128px, 78%, 260px); max-width: 100%; aspect-ratio: 1; display: grid; grid-template: repeat(3, 1fr) / repeat(3, 1fr); }
  .dpad::before, .dpad::after { content: ""; position: absolute; z-index: -1; background: var(--body-edge); border-radius: 6px; }
  /* Each bar runs between the centres of two opposite caps, one cap plus a 3px rim wide. */
  .dpad::before { left: calc(33.333% - 3px); right: calc(33.333% - 3px); top: 16.667%; bottom: 16.667%; }
  .dpad::after  { top: calc(33.333% - 3px); bottom: calc(33.333% - 3px); left: 16.667%; right: 16.667%; }
  .dpad .cap, .rotate .cap { background: radial-gradient(circle at 35% 30%, var(--button-highlight), var(--button) 55%, var(--button-edge)) padding-box; color: #fff; font-size: clamp(14px, 3vmin, 28px); font-size: clamp(14px, 5cqw, 28px); font-weight: 800; }
  .dpad .cap { width: 100%; height: 100%; position: relative; z-index: auto; justify-self: center; align-self: center; }
  .dpad [data-button="up"]    { grid-area: 1 / 2; }
  .dpad [data-button="left"]  { grid-area: 2 / 1; }
  .dpad [data-button="right"] { grid-area: 2 / 3; }
  .dpad [data-button="down"]  { grid-area: 3 / 2; }
  /* Cross style: the four caps merge into one moulded plus-shaped pad. */
  .dpad.dpad-cross::before, .dpad.dpad-cross::after { background: var(--button-edge); }
  .dpad.dpad-cross .cap { width: 100%; height: 100%; border-radius: 6px; }
  .rotate { display: flex; flex-direction: column; align-items: center; gap: .6em; }
  .rotate .ring { width: 54%; aspect-ratio: 1; border-radius: 50%; background: var(--body-edge); display: flex; align-items: center; justify-content: center; }
  .rotate .cap { width: 78%; aspect-ratio: 1; box-shadow: inset 0 -6px 0 rgba(0,0,0,.35); }
  .rotate .cap:active, .rotate .cap.down { box-shadow: inset 0 -3px 0 rgba(0,0,0,.35); }
  .rotate span { font-size: clamp(10px, 1.9vmin, 16px); font-size: clamp(10px, 3cqw, 16px); font-weight: 700; color: var(--print); letter-spacing: .08em; }
  .hint { position: fixed; left: 0; right: 0; bottom: max(6px, env(safe-area-inset-bottom, 0px)); text-align: center; color: #b8a76b; font-size: 12px; opacity: .8; pointer-events: none; }
  /* The shell fills the height on wide windows; the hint only fits under it on narrow ones. */
  @media (min-aspect-ratio: 9 / 17) { .hint { display: none; } }
  @media (prefers-reduced-motion: reduce) { .cap { transition: none; } }
  /* Settings card footer: bundle version + remote config freshness, always visible under the tabs. */
  .settings-footer { padding: 8px 18px calc(10px + env(safe-area-inset-bottom, 0px)); font-size: 10px; opacity: .55; text-align: center; border-top: 1px solid rgba(42,34,16,.14); }
  /* Ads: a full-screen retro card above everything, including the settings sheet. */
  .ad-overlay { position: fixed; inset: 0; z-index: 20; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,.75); touch-action: none; }
  .ad-overlay[hidden] { display: none; }
  .ad-card { position: relative; width: min(88vw, 320px); padding: 22px 20px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .ad-title { margin: 0; font-size: 15px; letter-spacing: .06em; }
  .ad-box { width: 100%; aspect-ratio: 16 / 9; border: 3px dashed #2a2210; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 30px; font-weight: 900; letter-spacing: .2em; opacity: .55; }
  .ad-countdown { font-variant-numeric: tabular-nums; font-size: 22px; font-weight: 800; }
  .ad-close { position: absolute; top: -14px; right: -14px; }
  /* Continue prompt: a bottom sheet from the settings-card family (same slide-up), a lighter
     dim so the board the player is about to lose stays readable, and a bar that runs down
     with the console's own offer timer. Sits under the ad overlay so a running ad covers it. */
  .settings.continue-sheet { z-index: 18; touch-action: none; }
  .settings.continue-sheet.open { background: rgba(0,0,0,.35); }
  .continue-card { padding: 16px 18px calc(14px + env(safe-area-inset-bottom, 0px)); gap: 10px; }
  .continue-head { display: flex; align-items: center; gap: 12px; }
  .continue-glyph { flex: 0 0 auto; width: 40px; height: 40px; border-radius: 8px; background: #2a2210; color: #f6f0dc; display: grid; place-items: center; font-size: 18px; letter-spacing: 0; }
  .continue-head h2 { margin: 0; font-size: 18px; letter-spacing: .04em; }
  .continue-sub { margin: 0; font-weight: 600; font-size: 13px; opacity: .8; line-height: 1.35; }
  .continue-timer { height: 6px; border-radius: 3px; background: rgba(42,34,16,.15); overflow: hidden; }
  .continue-timer i { display: block; height: 100%; width: 100%; background: #2a2210; border-radius: 3px; }
  .continue-actions { display: flex; gap: 10px; }
  .continue-actions .pill { flex: 1 1 0; min-height: 48px; font-size: 15px; }
  .continue-actions .pill.primary { flex: 2 1 0; background: #2a2210; color: #f6f0dc; }
  @media (min-width: 700px) and (min-height: 700px) { .continue-card { border-radius: 20px; } }
  .settings-footer { white-space: pre-line; }
  /* OTA: a small pill telling the player a fresh bundle is staged and ready to swap in. */
  .update-toast { position: fixed; top: max(10px, env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%); z-index: 15; display: flex; align-items: center; gap: 10px; background: #2a2210; color: #f6f0dc; padding: 8px 10px 8px 16px; border-radius: 999px; font-size: 12px; font-weight: 700; box-shadow: 0 4px 14px rgba(0,0,0,.35); }
  .update-toast[hidden] { display: none; }
</style>
</head>
<body>
  <div class="stage"><div class="console" id="console">
    <div class="body"></div>
    <div class="brand" data-i18n="super">SUPER</div>
    <div class="screen-row">
      <div class="bricks" id="bricks-left"></div>
      <div class="bezel"><canvas id="lcd" width="440" height="560" aria-label="LCD"></canvas></div>
      <div class="bricks" id="bricks-right"></div>
    </div>
    <div class="ribs" id="ribs"></div>
    <div class="small-row">
      <div class="key small"><button class="cap" data-button="power" aria-label="On/Off"></button><span data-i18n="power">ON/OFF</span></div>
      <div class="key small"><button class="cap" data-button="start" aria-label="Start/Pause"></button><span data-i18n="startPause">START/PAUSE</span></div>
      <div class="key small"><button class="cap" data-button="sound" aria-label="Sound"></button><span data-i18n="sound">SOUND</span></div>
      <div class="key small"><button class="cap" data-button="reset" aria-label="Reset"></button><span data-i18n="reset">RESET</span></div>
      <div class="key small"><button class="cap" id="open-settings" aria-label="Settings"></button><span data-i18n="setButton">SET</span></div>
    </div>
    <div class="pads">
      <div class="dpad" id="dpad">
        <button class="cap" data-button="up" aria-label="Up">▲</button>
        <button class="cap" data-button="left" aria-label="Left">◀</button>
        <button class="cap" data-button="right" aria-label="Right">▶</button>
        <button class="cap" data-button="down" aria-label="Down">▼</button>
      </div>
      <div class="rotate"><div class="ring"><button class="cap" data-button="rotate" aria-label="Rotate"></button></div><span data-i18n="rotate">ROTATE</span></div>
    </div>
    <div class="foot">
      <div class="foot-brand"><b data-i18n="brand">BRICK GAME</b><small><span data-i18n="model">9999 in 1</span> · <span id="model-label"></span></small></div>
      <div class="mascot-wrap"><canvas class="mascot" id="mascot"></canvas><span class="mascot-name" id="mascot-name"></span></div>
    </div>
    <div class="stickers-layer" id="stickers-layer"></div>
  </div></div>
  <div class="settings" id="settings" hidden>
    <div class="card" role="dialog" aria-modal="true">
      <div class="card-head">
        <h2 data-i18n="settings">SETTINGS</h2>
        <button type="button" class="close-x" id="close-settings" aria-label="Close">✕</button>
      </div>
      <div class="tabs" id="settings-tabs" role="tablist">
        <button type="button" class="tab-btn" data-tab="language" data-i18n="tabLanguage">LANGUAGE</button>
        <button type="button" class="tab-btn" data-tab="colors" data-i18n="tabColors">COLOURS</button>
        <button type="button" class="tab-btn" data-tab="shape" data-i18n="tabShape">SHAPE</button>
        <button type="button" class="tab-btn" data-tab="stickers" data-i18n="tabStickers">STICKERS</button>
        <button type="button" class="tab-btn" data-tab="presets" data-i18n="tabPresets">PRESETS</button>
      </div>
      <div class="card-body">

      <div class="tab-panel" data-panel="language">
        <div class="setting-row"><span class="setting-label" data-i18n="language">LANGUAGE</span><div class="pills" id="lang-pills"></div></div>
      </div>

      <div class="tab-panel" data-panel="colors">
        <div class="setting-row stack">
          <span class="setting-label" data-i18n="bodyColor">BODY</span>
          <div class="swatches" id="swatches"></div>
          <input type="color" id="custom-color" aria-label="Custom body colour">
          <div id="shell-name"></div>
        </div>
        <div class="setting-row"><span class="setting-label" data-i18n="buttonColor">BIG BUTTONS</span><div class="color-row" id="row-button"></div></div>
        <div class="setting-row"><span class="setting-label" data-i18n="smallButtonColor">SMALL BUTTONS</span><div class="color-row" id="row-small"></div></div>
        <div class="setting-row"><span class="setting-label" data-i18n="printColor">PRINT INK</span><div class="color-row" id="row-print"></div></div>
        <div class="setting-row"><span class="setting-label" data-i18n="glassColor">LCD GLASS</span><div class="pills" id="glass-pills"></div></div>
        <input type="color" id="glass-color" aria-label="Custom glass colour">
      </div>

      <div class="tab-panel" data-panel="shape">
        <div class="setting-row"><span class="setting-label" data-i18n="ribbed">Ribbed grip</span><div class="pills"><button type="button" class="pill" id="ribbed-toggle" data-i18n="ribbed">Ribbed grip</button></div></div>
        <div class="setting-row"><span class="setting-label" data-i18n="dpadStyle">D-PAD</span><div class="pills" id="dpad-pills"></div></div>
        <div class="setting-row"><span class="setting-label" data-i18n="mascot">MASCOT</span><div class="pills" id="mascot-pills"></div></div>
        <div class="setting-row"><span class="setting-label" data-i18n="modelLabel">MODEL LABEL</span><div class="field-row"><input type="text" class="text-input" id="model-label-input" maxlength="12"></div></div>
        <div class="field-row"><button type="button" class="pill" id="reset-shell" data-i18n="resetShell">Reset shell</button></div>
      </div>

      <div class="tab-panel" data-panel="stickers">
        <div class="field-row">
          <button type="button" class="pill" id="add-sticker" data-i18n="addSticker">Add image</button>
          <button type="button" class="pill" id="arrange-stickers" data-i18n="arrange">Arrange on shell</button>
        </div>
        <input type="file" id="sticker-file" accept="image/*">
        <div id="sticker-list"></div>
        <div id="sticker-message" role="status"></div>
      </div>

      <div class="tab-panel" data-panel="presets">
        <div class="field-row">
          <input type="text" class="text-input" id="preset-name" data-i18n-placeholder="presetName" placeholder="Preset name">
          <button type="button" class="pill" id="save-preset" data-i18n="savePreset">Save current</button>
        </div>
        <div id="preset-list"></div>
        <div class="setting-row stack">
          <span class="setting-label" data-i18n="shareCode">SHARE CODE</span>
          <div id="share-code"></div>
          <div class="field-row"><button type="button" class="pill" id="copy-share" data-i18n="copy">Copy</button></div>
        </div>
        <div class="field-row">
          <input type="text" class="text-input" id="import-code" data-i18n-placeholder="importCode" placeholder="Paste a code">
          <button type="button" class="pill" id="import-share" data-i18n="importButton">Import</button>
        </div>
        <div id="preset-message" role="status"></div>
      </div>

      </div>
      <div class="settings-footer" id="settings-footer"></div>
    </div>
  </div>
  <div class="settings continue-sheet" id="continue-overlay" hidden role="dialog" aria-labelledby="continue-title">
    <div class="card continue-card">
      <div class="continue-head"><span class="continue-glyph" aria-hidden="true">▶</span><h2 id="continue-title" data-i18n="adContinueTitle"></h2></div>
      <p class="continue-sub" data-i18n="adContinueSub"></p>
      <div class="continue-timer" aria-hidden="true"><i id="continue-timer-bar"></i></div>
      <div class="continue-actions">
        <button type="button" class="pill primary" id="continue-watch" data-i18n="adWatch"></button>
        <button type="button" class="pill" id="continue-decline" data-i18n="adNoThanks"></button>
      </div>
    </div>
  </div>
  <div class="ad-overlay" id="ad-overlay" hidden>
    <div class="card ad-card">
      <h2 class="ad-title" id="ad-title"></h2>
      <div class="ad-box">AD</div>
      <div class="ad-countdown" id="ad-countdown"></div>
      <button type="button" class="pill ad-skip" id="ad-skip" hidden></button>
      <button type="button" class="close-x ad-close" id="ad-close" hidden aria-label="Close">✕</button>
    </div>
  </div>
  <div class="update-toast" id="update-toast" hidden>
    <span data-i18n="updateReady"></span>
    <button type="button" class="pill" id="update-restart" data-i18n="restart"></button>
  </div>
  <div class="arrange-bar" id="arrange-bar" hidden>
    <span data-i18n="arrangeHint"></span>
    <span class="readout" id="arrange-readout" aria-live="polite"></span>
    <button type="button" class="pill" id="arrange-done" data-i18n="done">DONE</button>
  </div>
  <div class="hint" id="hint" data-i18n="hint"></div>
  <script>window.__brickBundleVersion='1.0.0';</script>
  <script type="module" src="main.js"></script>
</body>
</html>
